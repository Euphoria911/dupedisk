[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dupedisk"
version = "0.1.0"
description = "Find duplicate files and see where your disk went."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
dupedisk = "dupedisk.cli:main"

[tool.setuptools]
packages = ["dupedisk"]
